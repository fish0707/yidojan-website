<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一鬥讚 YIDOJAN</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
      background: linear-gradient(135deg, #FF7F3F 0%, #FF9966 50%, #FFB380 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .splash-container {
      text-align: center;
      cursor: pointer;
      animation: fadeIn 1s ease-in-out;
    }

    .logo-wrapper {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 0 auto 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: scaleIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .logo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.2));
      transition: transform 0.3s ease;
    }

    .splash-container:hover .logo-wrapper img {
      transform: scale(1.05);
    }

    .brand-text {
      color: white;
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      margin-bottom: 20px;
      animation: slideUp 0.8s ease-in-out 0.2s both;
    }

    .tagline {
      color: rgba(255, 255, 255, 0.9);
      font-size: 1rem;
      letter-spacing: 0.05em;
      animation: slideUp 0.8s ease-in-out 0.4s both;
      margin-bottom: 60px;
    }

    .scroll-hint {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
      animation: slideUp 0.8s ease-in-out 0.6s both;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .scroll-arrow {
      animation: bounce 2s infinite;
      font-size: 1.5rem;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes scaleIn {
      from {
        transform: scale(0.8);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    @media (max-width: 768px) {
      .logo-wrapper {
        width: 250px;
        height: 250px;
      }

      .brand-text {
        font-size: 2rem;
      }

      .tagline {
        font-size: 0.9rem;
      }
    }

    @media (max-width: 480px) {
      .logo-wrapper {
        width: 200px;
        height: 200px;
      }

      .brand-text {
        font-size: 1.5rem;
      }

      .tagline {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="splash-container" onclick="enterSite()">
    <div>
      <div class="logo-wrapper">
        <img src="logo.png" alt="YIDOJAN Logo">
      </div>
      <h1 class="brand-text">一鬥讚</h1>
      <p class="tagline">YIDOJAN - 精選台灣茶飲</p>
      <div class="scroll-hint">
        <span>點擊進入</span>
        <span class="scroll-arrow">↓</span>
      </div>
    </div>
  </div>

  <script>
    function enterSite() {
      window.location.href = 'index.html';
    }

    // 也可以按任何鍵進入
    document.addEventListener('keydown', function() {
      enterSite();
    });

    // 也可以點擊或滾動進入
    document.addEventListener('click', function() {
      enterSite();
    });

    document.addEventListener('wheel', function(e) {
      if (e.deltaY > 0) {
        enterSite();
      }
    });
  </script>
</body>
</html>
