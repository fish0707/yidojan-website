<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接單看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #1a1208; --surface: #2c1f12; --card: #3a2918;
  --brown: #c8956a; --gold: #f5c842;
  --green: #52b788; --red: #e07070; --blue: #74b2d0;
  --text: #f0e6d8; --muted: #9e8c7e; --border: #4a3828;
  --radius: 14px;
}
body { font-family: 'Noto Sans TC', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }

/* ── Top Bar ── */
.topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: 56px; position: sticky; top: 0; z-index: 50;
}
.topbar .logo { font-size: 17px; font-weight: 700; color: var(--brown); letter-spacing: 1px; }
.topbar .stats { display: flex; gap: 20px; }
.topbar .stat { text-align: right; }
.topbar .stat .val { font-size: 18px; font-weight: 700; color: var(--gold); }
.topbar .stat .label { font-size: 10px; color: var(--muted); }
.topbar .time { font-size: 13px; color: var(--muted); }
.alert-badge { background: var(--red); color: #fff; border-radius: 99px; padding: 3px 10px; font-size: 11px; font-weight: 700; cursor: pointer; }

/* ── Tab Nav ── */
.tabnav { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
.tabnav button {
  flex: 1; padding: 13px 0; border: none; background: transparent;
  color: var(--muted); font-size: 13px; font-weight: 500;
  border-bottom: 3px solid transparent; transition: .15s;
}
.tabnav button.active { color: var(--brown); border-color: var(--brown); font-weight: 700; }
.tabnav .badge { background: var(--red); color: #fff; border-radius: 99px; font-size: 10px; padding: 1px 5px; margin-left: 4px; font-weight: 700; }

/* ── Tab Content ── */
.tab-content { display: none; padding: 16px; }
.tab-content.active { display: block; }

/* ── Order Cards ── */
.orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.order-card {
  background: var(--card); border-radius: var(--radius); padding: 16px;
  border: 1.5px solid var(--border); position: relative; overflow: hidden;
  animation: slideIn .25s ease;
}
.order-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.order-card.pending::before { background: var(--gold); }
.order-card.accepted::before { background: var(--green); }
.order-card .meta { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.order-card .order-id { font-size: 12px; color: var(--muted); }
.order-card .customer { font-size: 15px; font-weight: 700; }
.order-card .time-tag { font-size: 11px; color: var(--muted); margin-top: 2px; }
.order-card .total { font-size: 20px; font-weight: 700; color: var(--gold); }
.items-list { margin: 8px 0 12px; border-top: 1px solid var(--border); padding-top: 8px; }
.item-row { font-size: 13px; padding: 4px 0; display: flex; align-items: baseline; gap: 6px; }
.item-row .item-name { font-weight: 600; }
.item-row .item-detail { color: var(--muted); font-size: 11px; }
.remark { font-size: 11px; color: var(--blue); padding: 6px 10px; background: rgba(116,178,208,.1); border-radius: 8px; margin-bottom: 10px; }
.status-badge { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; }
.status-badge.pending  { background: rgba(245,200,66,.15); color: var(--gold); }
.status-badge.accepted { background: rgba(82,183,136,.15); color: var(--green); }
.status-badge.printed  { background: rgba(156,156,156,.15); color: var(--muted); }
.btn-accept {
  width: 100%; padding: 10px; margin-top: 8px;
  background: var(--green); color: #1a1208; border: none; border-radius: 10px;
  font-size: 14px; font-weight: 700; transition: opacity .15s;
}
.btn-accept:hover { opacity: .85; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }

/* ── Inventory Tab ── */
.inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.inv-card { background: var(--card); border-radius: var(--radius); padding: 14px; border: 1.5px solid var(--border); }
.inv-card.low { border-color: var(--red); background: rgba(224,112,112,.06); }
.inv-card .inv-name { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
.inv-card .inv-stock { font-size: 22px; font-weight: 700; }
.inv-card .inv-stock.low-text { color: var(--red); }
.progress { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 8px 0 4px; }
.progress-bar { height: 100%; border-radius: 3px; transition: width .4s; }
.inv-card .safe { font-size: 11px; color: var(--muted); }
.toggle-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); }
.toggle-label { font-size: 12px; color: var(--muted); }
.toggle { width: 36px; height: 20px; background: var(--border); border-radius: 99px; position: relative; cursor: pointer; border: none; transition: .2s; }
.toggle.on { background: var(--green); }
.toggle::after { content: ''; position: absolute; width: 14px; height: 14px; background: #fff; border-radius: 50%; top: 3px; left: 3px; transition: .2s; }
.toggle.on::after { left: 19px; }

/* ── Report Tab ── */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
.stat-card { background: var(--card); border-radius: var(--radius); padding: 14px 16px; border: 1px solid var(--border); }
.stat-card .s-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.stat-card .s-val { font-size: 22px; font-weight: 700; }
.chart-wrap { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); }
.chart-wrap h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 12px; }
.range-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
.range-tab { padding: 6px 14px; border: 1.5px solid var(--border); border-radius: 99px; background: transparent; color: var(--muted); font-size: 12px; transition: .15s; }
.range-tab.active { background: var(--brown); color: var(--bg); border-color: var(--brown); font-weight: 700; }
.ranking-list { list-style: none; }
.ranking-list li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.ranking-list li:last-child { border: none; }
.rank-num { width: 20px; font-weight: 700; color: var(--gold); }
.rank-bar-wrap { flex: 1; height: 6px; background: var(--border); border-radius: 3px; margin: 0 10px; overflow: hidden; }
.rank-bar { height: 100%; background: var(--brown); border-radius: 3px; }
.rank-qty { font-weight: 600; color: var(--text); min-width: 40px; text-align: right; }

@keyframes slideIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
.pulsing { animation: pulse 1.5s infinite; }
</style>
</head>
<body>

<!-- Audio for new order notification -->
<audio id="ding" preload="auto">
  <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAA..." type="audio/wav">
</audio>

<!-- Top Bar -->
<div class="topbar">
  <div class="logo">🧋 接單看板</div>
  <div class="stats">
    <div class="stat"><div class="val" id="todayRevenue">$0</div><div class="label">今日營收</div></div>
    <div class="stat"><div class="val" id="todayOrders">0</div><div class="label">今日訂單</div></div>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <div id="lowStockAlert" style="display:none" class="alert-badge" onclick="switchTab('inventory')">⚠️ 庫存警示</div>
    <div class="time" id="clock"></div>
  </div>
</div>

<!-- Tab Nav -->
<div class="tabnav">
  <button class="active" onclick="switchTab('orders')">📋 待接單 <span class="badge" id="pendingBadge" style="display:none">0</span></button>
  <button onclick="switchTab('accepted')">👨‍🍳 製作中 <span class="badge" id="acceptedBadge" style="display:none">0</span></button>
  <button onclick="switchTab('inventory')">📦 庫存</button>
  <button onclick="switchTab('report')">📊 報表</button>
</div>

<!-- Orders Tab -->
<div class="tab-content active" id="tab-orders">
  <div class="orders-grid" id="pendingGrid"></div>
</div>
<div class="tab-content" id="tab-accepted">
  <div class="orders-grid" id="acceptedGrid"></div>
</div>

<!-- Inventory Tab -->
<div class="tab-content" id="tab-inventory">
  <div class="inv-grid" id="invGrid"></div>
</div>

<!-- Report Tab -->
<div class="tab-content" id="tab-report">
  <div class="range-tabs">
    <button class="range-tab active" onclick="loadReport('today', this)">今日</button>
    <button class="range-tab" onclick="loadReport('week', this)">本週</button>
    <button class="range-tab" onclick="loadReport('month', this)">本月</button>
  </div>
  <div class="stats-row">
    <div class="stat-card"><div class="s-label">訂單數</div><div class="s-val" id="rOrders" style="color:var(--blue)">-</div></div>
    <div class="stat-card"><div class="s-label">營收</div><div class="s-val" id="rRevenue" style="color:var(--gold)">-</div></div>
    <div class="stat-card"><div class="s-label">客單價</div><div class="s-val" id="rAvg" style="color:var(--green)">-</div></div>
    <div class="stat-card"><div class="s-label">熱銷第一</div><div class="s-val" id="rTop" style="color:var(--brown);font-size:15px">-</div></div>
  </div>
  <div class="chart-wrap">
    <h3>每日營收</h3>
    <canvas id="revenueChart" height="80"></canvas>
  </div>
  <div class="chart-wrap">
    <h3>品項銷量排行</h3>
    <ul class="ranking-list" id="rankingList"></ul>
  </div>
</div>

<script>
// ─── 設定 ──────────────────────────────────────────────────────────────────────
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxtcztvHR0XEvTf-7PGEX-8ETlF69AhyAUYnaMJ8MeqhokJHbFJwOn-EMAYmjyhQayZfg/exec'; // ← 換成你的 GAS 部署網址
const POLL_INTERVAL = 4000; // 輪詢間隔（毫秒）

// ─── 狀態 ──────────────────────────────────────────────────────────────────────
let knownOrderIds = new Set();
let revenueChartInstance = null;

// ─── 時鐘 ──────────────────────────────────────────────────────────────────────
function updateClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
setInterval(updateClock, 1000);
updateClock();

// ─── Tab 切換 ──────────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tabnav button').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.querySelectorAll('.tabnav button')[['orders','accepted','inventory','report'].indexOf(name)].classList.add('active');
  if (name === 'inventory') loadInventory();
  if (name === 'report') loadReport('today', document.querySelector('.range-tab.active'));
}

// ─── API 呼叫 ──────────────────────────────────────────────────────────────────
async function gasGet(params) {
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(`${GAS_URL}?${qs}`);
  return res.json();
}
async function gasPost(body) {
  const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(body) });
  return res.json();
}

// ─── 輪詢訂單 ──────────────────────────────────────────────────────────────────
async function pollOrders() {
  try {
    const [pendingData, acceptedData] = await Promise.all([
      gasGet({ action: 'getOrders', status: '待接單' }),
      gasGet({ action: 'getOrders', status: '已接單' }),
    ]);

    const pending  = pendingData.orders  || [];
    const accepted = acceptedData.orders || [];

    // 新訂單音效
    const newIds = pending.filter(o => !knownOrderIds.has(o.orderId));
    if (newIds.length > 0) { playDing(); newIds.forEach(o => knownOrderIds.add(o.orderId)); }
    pending.forEach(o => knownOrderIds.add(o.orderId));

    renderOrders(pending,  'pendingGrid',  true);
    renderOrders(accepted, 'acceptedGrid', false);

    setBadge('pendingBadge',  pending.length);
    setBadge('acceptedBadge', accepted.length);

    // 今日統計（輕量讀取）
    const rpt = await gasGet({ action: 'getReport', range: 'today' });
    document.getElementById('todayRevenue').textContent = '$' + (rpt.totalRevenue || 0);
    document.getElementById('todayOrders').textContent  = rpt.totalOrders || 0;
  } catch (e) {
    console.warn('輪詢失敗', e.message);
  }
}

function setBadge(id, count) {
  const el = document.getElementById(id);
  el.textContent = count;
  el.style.display = count > 0 ? 'inline' : 'none';
}

// ─── 渲染訂單卡 ───────────────────────────────────────────────────────────────
function renderOrders(orders, gridId, showAcceptBtn) {
  const grid = document.getElementById(gridId);
  if (orders.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="icon">${showAcceptBtn ? '📭' : '☕'}</div><div>${showAcceptBtn ? '目前沒有待接訂單' : '目前沒有製作中訂單'}</div></div>`;
    return;
  }
  grid.innerHTML = orders.map(o => {
    const items = typeof o.items === 'string' ? JSON.parse(o.items) : o.items;
    const statusClass = showAcceptBtn ? 'pending' : 'accepted';
    const statusLabel = showAcceptBtn ? '待接單' : '製作中';
    return `
    <div class="order-card ${statusClass}">
      <div class="meta">
        <div>
          <div class="order-id">#${o.orderId}</div>
          <div class="customer">${o.name}</div>
          <div class="time-tag">🕐 ${o.time}</div>
        </div>
        <div>
          <div class="total">$${o.total}</div>
          <span class="status-badge ${statusClass}">${statusLabel}</span>
        </div>
      </div>
      <div class="items-list">
        ${items.map(i => `
          <div class="item-row">
            <span class="item-name">× ${i.qty} ${i.productId}</span>
            <span class="item-detail">${i.sugar || ''} / ${i.ice || ''}${(i.toppings || []).length ? ' + ' + i.toppings.join(', ') : ''}</span>
          </div>`).join('')}
      </div>
      ${o.remark ? `<div class="remark">📝 ${o.remark}</div>` : ''}
      ${showAcceptBtn
        ? `<button class="btn-accept" onclick="acceptOrder('${o.orderId}', this)">✓ 確認接單</button>`
        : `<button class="btn-accept" style="background:var(--blue);color:#fff" onclick="completeOrder('${o.orderId}', this)">✓ 完成取餐</button>`}
    </div>`;
  }).join('');
}

async function completeOrder(orderId, btn) {
  btn.disabled = true;
  btn.textContent = '處理中…';
  try {
    await gasPost({ action: 'updateStatus', orderId, status: '已列印' });
    btn.closest('.order-card').style.opacity = '.4';
    setTimeout(() => pollOrders(), 500);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '✓ 完成取餐';
    alert('操作失敗，請重試');
  }
}

async function acceptOrder(orderId, btn) {
  btn.disabled = true;
  btn.textContent = '處理中…';
  try {
    await gasPost({ action: 'updateStatus', orderId, status: '已接單' });
    btn.closest('.order-card').style.opacity = '.4';
    setTimeout(() => pollOrders(), 500);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '✓ 確認接單';
    alert('操作失敗，請重試');
  }
}

// ─── 庫存 ──────────────────────────────────────────────────────────────────────
async function loadInventory() {
  const grid = document.getElementById('invGrid');
  grid.innerHTML = '<div style="color:var(--muted);padding:20px">載入中…</div>';
  const data = await gasGet({ action: 'getInventory' });
  const inventory = data.inventory || [];

  const lowCount = inventory.filter(i => i.isLow).length;
  const alertEl = document.getElementById('lowStockAlert');
  alertEl.style.display = lowCount > 0 ? 'inline' : 'none';
  if (lowCount > 0) alertEl.textContent = `⚠️ ${lowCount} 項低庫存`;

  grid.innerHTML = inventory.map(ing => {
    const pct = Math.min(100, (ing.stock / (ing.safeStock * 3)) * 100);
    return `
    <div class="inv-card ${ing.isLow ? 'low' : ''}">
      <div class="inv-name">${ing.name}</div>
      <div class="inv-stock ${ing.isLow ? 'low-text' : ''}">${ing.stock} <span style="font-size:14px;font-weight:400;color:var(--muted)">${ing.unit}</span></div>
      <div class="progress"><div class="progress-bar" style="width:${pct}%;background:${ing.isLow ? 'var(--red)' : 'var(--green)'}"></div></div>
      <div class="safe">安全庫存：${ing.safeStock} ${ing.unit}</div>
    </div>`;
  }).join('');
}

// ─── 報表 ──────────────────────────────────────────────────────────────────────
async function loadReport(range, btn) {
  document.querySelectorAll('.range-tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  const data = await gasGet({ action: 'getReport', range });
  const { totalOrders, totalRevenue, salesRanking, daily } = data;
  const avg = totalOrders > 0 ? Math.round(totalRevenue / totalOrders) : 0;

  document.getElementById('rOrders').textContent  = totalOrders;
  document.getElementById('rRevenue').textContent = '$' + totalRevenue;
  document.getElementById('rAvg').textContent     = '$' + avg;
  document.getElementById('rTop').textContent     = salesRanking?.[0]?.name || '-';

  // Revenue Chart
  const labels   = (daily || []).map(d => d.date?.toString().slice(5) || '');
  const revenues = (daily || []).map(d => d.revenue || 0);
  if (revenueChartInstance) revenueChartInstance.destroy();
  revenueChartInstance = new Chart(document.getElementById('revenueChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{ data: revenues, backgroundColor: 'rgba(200,149,106,.7)', borderRadius: 6 }],
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#9e8c7e', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,.05)' } },
        y: { ticks: { color: '#9e8c7e', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,.05)' } },
      },
    },
  });

  // Ranking
  const maxQty = salesRanking?.[0]?.qty || 1;
  document.getElementById('rankingList').innerHTML = (salesRanking || []).slice(0, 8).map((item, i) => `
    <li>
      <span class="rank-num">${i + 1}</span>
      <span style="flex:1;font-weight:${i < 3 ? 600 : 400}">${item.name}</span>
      <div class="rank-bar-wrap"><div class="rank-bar" style="width:${(item.qty / maxQty * 100).toFixed(0)}%"></div></div>
      <span class="rank-qty">${item.qty} 杯</span>
    </li>`).join('');
}

// ─── 音效 ──────────────────────────────────────────────────────────────────────
function playDing() {
  // 用 Web Audio API 合成簡單提示音（不依賴外部音檔）
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.15, 0.3].forEach((delay, i) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = [880, 1046, 1318][i];
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.4);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + 0.4);
    });
  } catch (e) {}
}

// ─── 啟動 ──────────────────────────────────────────────────────────────────────
pollOrders();
setInterval(pollOrders, POLL_INTERVAL);
</script>
</body>
</html>
